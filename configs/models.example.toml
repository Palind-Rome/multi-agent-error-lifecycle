# Copy to a local, git-ignored configuration only after the study choices are fixed.
# Never place API keys in this file; providers should read them from environment variables.

[homogeneous]
provider = "UNSET"
model = "UNSET"

[heterogeneous.planner]
provider = "UNSET"
model = "UNSET"

[heterogeneous.worker]
provider = "UNSET"
model = "UNSET"

[heterogeneous.verifier]
provider = "UNSET"
model = "UNSET"

[judge]
provider = "UNSET"
model = "UNSET"
purpose = "artifact_adoption_or_diagnostic_scoring"
prompt_name = "UNSET"
prompt_sha256 = "UNSET"
scoring_mode = "UNSET"
calibration_dataset = "UNSET"
calibration_version = "UNSET"
agreement_reference = "UNSET"
tested_model_disjoint = true
# A boolean is not sufficient provenance: runtime code must compare provider/model
# identities and persist votes, aggregation, blind fields, tokens, and cost.

[limits]
# Zero means intentionally blocked, not unlimited. Copy this file locally and
# set explicit positive caps before any real-model call.
max_input_tokens_per_call = 0
max_output_tokens_per_call = 0
max_cost_usd_per_run = 0.0
max_wall_seconds_per_run = 0
max_actions_per_agent = 0
max_cost_usd_per_experiment = 0.0
