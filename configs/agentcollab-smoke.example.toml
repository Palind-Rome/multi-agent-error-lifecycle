# Copy this file to configs/agentcollab-smoke.local.toml before use.
# The .local.toml copy is git-ignored. Never put an API key here. The driver
# accepts it only through hidden input or one non-TTY stdin line.

[provider]
base_url = "https://aigateway.paperbypass.com/api/v1"
model = "qwen/qwen3-30b-a3b-instruct-2507"
temperature = 0.0
request_timeout_seconds = 60.0
# PaperBypass does not publicly guarantee seed passthrough. Python-side RTD
# injection randomness is still fixed by CLI --seed (default 7). Set this true
# only after a separate capability check confirms the gateway accepts seed.
send_seed = false

[limits]
# These are deliberately small engineering-smoke ceilings, not study defaults.
# Confirm that max_calls covers the selected task's expected_turns before use.
max_calls = 8
max_input_tokens = 200000
# A 1024-token per-call ceiling truncated the pinned Qwen during the first
# engineering smoke. Eight calls at this verified ceiling remain below the
# hard cost cap when combined with the input-token ceiling and prices below.
max_output_tokens = 32768
max_output_tokens_per_call = 4096
max_wall_seconds = 900.0
max_cost_usd = 0.02

# Conservative configured ceilings in USD per 1M tokens for the pinned model.
# Re-check current provider pricing before every real smoke. Runtime accounting
# uses the greater of this estimate and provider-reported cost when available.
max_input_cost_usd_per_million_tokens = 0.04815
max_output_cost_usd_per_million_tokens = 0.19305
